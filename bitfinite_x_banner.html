<!-- X / Twitter profile banner, 1500x500. Regenerate with:
       google-chrome --headless=new --disable-gpu --hide-scrollbars \
         --window-size=1500,500 --virtual-time-budget=8000 \
         --screenshot=bitfinite_x_banner_1500x500.png \
         file://$PWD/bitfinite_x_banner.html
     Inter is pulled from Google Fonts, so render with a network connection or
     the wordmark falls back to a system sans and the spacing shifts.
     Content stays centred: X overlays the profile picture bottom-left and
     crops the sides on narrow screens. -->
<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1500px; height:500px; }
  body{
    background:#05070f;
    /* the glow sits behind the wordmark, same as the current banner */
    background-image: radial-gradient(62% 88% at 50% 33%, #1a3d8f 0%, #0d2153 30%, #071129 55%, #03050c 82%);
    font-family:'Inter',system-ui,sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:#fff; -webkit-font-smoothing:antialiased;
  }
  .row{ display:flex; align-items:center; gap:34px; margin-bottom:44px; }
  .row img{ width:152px; height:152px; display:block; }
  .word{ font-size:104px; font-weight:800; letter-spacing:.055em; line-height:1; }
  .tag{ font-size:44px; font-weight:400; color:#93a9f5; letter-spacing:-.005em; margin-bottom:26px; }
  .facts{ font-size:23px; font-weight:600; color:#8892a8; letter-spacing:.012em; }
  .facts b{ color:#c9d3e8; font-weight:600; }
  .dot{ opacity:.45; padding:0 14px; }
</style></head><body>
  <div class="row"><img src="bitfinite_mark_circle.png"><div class="word">BITFINITE</div></div>
  <div class="tag">Freely mined, fairly launched.</div>
  <div class="facts">
    <b>$BFX</b><span class="dot">·</span>SHA-256d<span class="dot">·</span>5-min blocks<span class="dot">·</span>21M cap<span class="dot">·</span><b>Mine it with a Bitaxe</b>
  </div>
</body></html>
